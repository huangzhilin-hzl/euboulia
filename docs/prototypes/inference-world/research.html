<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Euboulia 本地研究工作台：从方向到实验，与 Agent 一起讨论、分支验证、积累经验。"
    />
    <title>Euboulia · 本地研究工作台</title>
    <script src="appearance.js"></script>
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="research.css" />
  </head>
  <body>
    <a class="skip" href="#main">跳到研究内容</a>
    <div class="workbench">
      <nav class="rail" aria-label="工作台导航">
        <button class="brand" data-action="home" aria-label="Euboulia 首页">
          e<span>·</span>
        </button>
        <button
          class="rail-button active"
          data-action="home"
          aria-label="研究方向"
          title="研究方向"
        >
          <span data-icon="compass"></span>
        </button>
        <button
          class="rail-button"
          data-action="search"
          aria-label="搜索研究记录"
          title="搜索 · ⌘K"
        >
          <span data-icon="search"></span>
        </button>
        <button
          class="rail-button"
          data-action="memories"
          aria-label="经验库"
          title="经验库"
        >
          <span data-icon="book"></span>
        </button>
        <div class="rail-bottom">
          <button
            id="appearance-trigger"
            class="appearance-trigger"
            aria-label="切换外观"
            aria-haspopup="dialog"
            aria-controls="appearance-dialog"
          >
            <span data-icon="palette"></span><span>外观</span>
          </button>
          <span class="avatar" title="本地研究者">J</span>
        </div>
      </nav>
      <aside class="sidebar" id="sidebar" aria-label="研究与分支">
        <div class="workspace-name">Julian’s lab</div>
        <div class="workspace-caption">
          <span class="local-dot"></span>本地研究工作台
        </div>
        <button class="side-new" data-action="new">
          <span data-icon="plus"></span>开始一个新方向
        </button>
        <div id="side-content"></div>
        <div class="side-bottom">
          <p>想法有来处，结论有依据。</p>
          <p>研究记录保存在此浏览器</p>
          <button data-action="about">原型说明与备份 ↗</button>
        </div>
      </aside>
      <main class="main" id="main" tabindex="-1">
        <header class="topbar">
          <div class="breadcrumb" id="breadcrumb"></div>
          <div class="top-tools">
            <span class="prototype"
              >交互原型<span class="prototype-detail"> · 演示执行</span></span
            ><button
              class="icon-button"
              data-action="export"
              aria-label="导出研究备份"
              title="导出研究备份"
            >
              <span data-icon="download"></span></button
            ><button
              class="icon-button mobile-nav"
              data-action="sidebar"
              aria-label="展开研究导航"
              aria-expanded="false"
            >
              <span data-icon="menu"></span>
            </button>
          </div>
        </header>
        <div
          class="storage-warning"
          id="storage-warning"
          role="alert"
          hidden
        ></div>
        <div id="content"></div>
      </main>
    </div>
    <dialog id="flow-dialog" aria-labelledby="flow-title">
      <form id="flow-form">
        <header class="dialog-heading">
          <h2 id="flow-title"></h2>
          <button
            type="button"
            class="icon-button"
            data-action="close-dialog"
            aria-label="关闭对话框"
          >
            ×
          </button>
        </header>
        <div class="dialog-content">
          <div id="flow-fields"></div>
          <p class="form-error" id="flow-error" role="alert"></p>
        </div>
        <footer class="dialog-footer">
          <small id="flow-hint">仅保存到本地</small
          ><button type="button" class="button" data-action="close-dialog">
            取消</button
          ><button type="submit" class="button primary" id="flow-submit">
            保存
          </button>
        </footer>
      </form>
    </dialog>
    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <header class="dialog-heading">
        <h2 id="detail-title"></h2>
        <button
          type="button"
          class="icon-button"
          data-action="close-detail"
          aria-label="关闭详情"
        >
          ×
        </button>
      </header>
      <div id="detail-content" class="dialog-content"></div>
    </dialog>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <header class="dialog-heading">
        <h2 id="search-title">搜索研究记录</h2>
        <button
          type="button"
          class="icon-button"
          data-action="close-search"
          aria-label="关闭搜索"
        >
          ×
        </button>
      </header>
      <div class="dialog-content">
        <input
          id="search-input"
          type="search"
          aria-label="搜索方向、方案、讨论或经验"
          placeholder="方向、方案、讨论或经验…"
        />
        <div id="search-results"></div>
      </div>
    </dialog>
    <input
      id="backup-input"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <dialog
      id="appearance-dialog"
      aria-labelledby="appearance-title"
      aria-describedby="appearance-description"
    >
      <div class="appearance-heading">
        <div>
          <h2 id="appearance-title">选一套看着舒服的外观</h2>
          <p id="appearance-description">
            点选即可比较，整个工作台会一起变化。
          </p>
        </div>
        <button
          class="icon-button"
          data-appearance-close
          aria-label="关闭外观设置"
        >
          ×
        </button>
      </div>
      <fieldset class="theme-options">
        <legend class="sr-only">工作台主题</legend>
        <label class="theme-option"
          ><input
            type="radio"
            name="appearance"
            value="neutral"
            aria-label="雾白"
          /><span class="theme-preview" data-theme="neutral" aria-hidden="true"
            ><span class="preview-rail"><i></i><i></i><i></i></span
            ><span class="preview-side"><i></i><i></i><i></i></span
            ><span class="preview-main"
              ><i class="preview-title"></i
              ><span class="preview-message"
                ><i class="preview-avatar"></i
                ><span class="preview-lines"><i></i><i></i></span></span
              ><span class="preview-card"><i></i><i></i></span
              ><span class="preview-composer"><i></i></span></span></span
          ><span class="theme-caption"
            ><strong>雾白</strong><em>推荐</em
            ><span class="theme-check">✓</span></span
          ><span class="theme-description">清晰中性 · 靛蓝点缀</span></label
        >
        <label class="theme-option"
          ><input
            type="radio"
            name="appearance"
            value="graphite"
            aria-label="石墨"
          /><span class="theme-preview" data-theme="graphite" aria-hidden="true"
            ><span class="preview-rail"><i></i><i></i><i></i></span
            ><span class="preview-side"><i></i><i></i><i></i></span
            ><span class="preview-main"
              ><i class="preview-title"></i
              ><span class="preview-message"
                ><i class="preview-avatar"></i
                ><span class="preview-lines"><i></i><i></i></span></span
              ><span class="preview-card"><i></i><i></i></span
              ><span class="preview-composer"><i></i></span></span></span
          ><span class="theme-caption"
            ><strong>石墨</strong><em>深色</em
            ><span class="theme-check">✓</span></span
          ><span class="theme-description">冷灰深色 · 柔和紫色</span></label
        >
        <label class="theme-option"
          ><input
            type="radio"
            name="appearance"
            value="cream"
            aria-label="奶油黄"
          /><span class="theme-preview" data-theme="cream" aria-hidden="true"
            ><span class="preview-rail"><i></i><i></i><i></i></span
            ><span class="preview-side"><i></i><i></i><i></i></span
            ><span class="preview-main"
              ><i class="preview-title"></i
              ><span class="preview-message"
                ><i class="preview-avatar"></i
                ><span class="preview-lines"><i></i><i></i></span></span
              ><span class="preview-card"><i></i><i></i></span
              ><span class="preview-composer"><i></i></span></span></span
          ><span class="theme-caption"
            ><strong>奶油黄</strong><em>鲜明</em
            ><span class="theme-check">✓</span></span
          ><span class="theme-description">暖纸底色 · 明快黄栏</span></label
        >
        <label class="theme-option"
          ><input
            type="radio"
            name="appearance"
            value="sage"
            aria-label="暖绿"
          /><span class="theme-preview" data-theme="sage" aria-hidden="true"
            ><span class="preview-rail"><i></i><i></i><i></i></span
            ><span class="preview-side"><i></i><i></i><i></i></span
            ><span class="preview-main"
              ><i class="preview-title"></i
              ><span class="preview-message"
                ><i class="preview-avatar"></i
                ><span class="preview-lines"><i></i><i></i></span></span
              ><span class="preview-card"><i></i><i></i></span
              ><span class="preview-composer"><i></i></span></span></span
          ><span class="theme-caption"
            ><strong>暖绿</strong><em>原版</em
            ><span class="theme-check">✓</span></span
          ><span class="theme-description">低饱和绿 · 原有配色</span></label
        >
      </fieldset>
      <div class="appearance-footer">
        <p id="appearance-status" role="status" aria-live="polite">
          选择会保存在此浏览器
        </p>
        <button class="button primary" data-appearance-close>完成</button>
      </div>
    </dialog>
    <script type="module" src="research.mjs"></script>
  </body>
</html>
