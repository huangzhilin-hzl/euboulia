# Read-only external-service example. Replace repository, revision, patch,
# evaluator commands, and every baseline metric before active use.
schema_version: 3
name: vllm-external-evidence-loop
framework: vllm

models:
  target:
    id: target
    path: your-org/your-model
    served_name: your-model
    revision: REPLACE_WITH_PINNED_MODEL_REVISION

endpoint: http://127.0.0.1:8000

workload_suite:
  id: serving-shape-matrix
  dataset: random
  request_rate: inf
  points:
    - id: isl1k-osl256-c1
      input_tokens: 1024
      output_tokens: 256
      concurrency: 1
      num_prompts: 32
    - id: isl1k-osl256-c32
      input_tokens: 1024
      output_tokens: 256
      concurrency: 32
      num_prompts: 320

benchmark:
  mode: serve
  base_args: []
  result_filename: result.json
  parameters: {}

baseline:
  id: baseline
  source_revision: REPLACE_WITH_PINNED_COMMIT
  target_parameters: {}
  # External mode cannot measure a managed baseline, so every point is explicit.
  metric_values:
    isl1k-osl256-c1: 100.0
    isl1k-osl256-c32: 100.0

optimization:
  profiles:
    provider: imported
    artifacts:
      - path: profiles/vllm-compute.ncu.csv
        source: ncu_csv

  planner:
    provider: rules
    patch_catalog: catalogs/vllm-patches.yaml
    max_proposals_per_iteration: 1
    reject_duplicate_diffs: true

  workspace:
    repository: /path/to/vllm
    root_dir: ../.euboulia-worktrees
    timeout_seconds: 120
    max_patch_bytes: 262144
    max_changed_files: 8
    max_changed_lines: 400

  evaluation:
    metric: output_throughput
    direction: maximize
    metrics_path: euboulia-result.json
    promotion:
      primary_points: [isl1k-osl256-c1, isl1k-osl256-c32]
      require_all_points_valid: true
      min_relative_improvement: 0.03
      max_regression_per_point: 0.0
      noise_tolerance: 0.01
    tiers:
      - kind: correctness
        warmups: 0
        repetitions: 1
        timeout_seconds: 600
        required_metrics: []
        commands:
          - name: kernel-correctness
            argv: [python, -m, pytest, tests/kernels]
      - kind: performance
        warmups: 2
        repetitions: 5
        timeout_seconds: 1800
        required_metrics: [output_throughput]
        commands:
          - name: unprofiled-serving-benchmark
            # This finite command must honor EUBOULIA_* and write EUBOULIA_METRICS_PATH.
            argv: [python, your_finite_benchmark_harness.py]

  budget:
    max_iterations: 10
    max_wall_time_seconds: 14400
    max_consecutive_failures: 3
    no_improvement_patience: 5
    max_profile_bytes: 2147483648

execution:
  artifacts_dir: ../experiments/optimization-vllm
