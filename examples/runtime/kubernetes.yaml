# Copy this host-only file to ~/.config/euboulia/config.yaml and replace the
# local path and Pod coordinates. It is deliberately separate from scenario recipes.
storage:
  root: ~/.local/share/euboulia
  sync:
    raw_profiles: on_demand

executors:
  h20-pod:
    type: kubernetes
    namespace: inference
    pod: dsv4-h20
    container: runtime
    # The local checkout must already be available at this path in the Pod.
    project_dir: /workspace/euboulia
    scratch_dir: /home/admin/.cache/euboulia
    python: python3
