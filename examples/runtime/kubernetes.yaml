# Copy this host-only file to ~/.config/euboulia/config.yaml and replace the
# local paths and cluster policy. It is deliberately separate from scenario recipes.
storage:
  root: ~/.local/share/euboulia
  sync:
    raw_profiles: on_demand

executors:
  gpu-worker:
    type: kubernetes
    namespace: your-namespace
    # Keep the real template outside the repository. One template may be reused by
    # experiments with the same accelerator resources and cluster policy.
    pod_template: ~/.config/euboulia/pod-templates/gpu-worker.yaml
    container: runtime
    # Euboulia transfers the local checkout here after creating its Pod.
    project_dir: /workspace/euboulia
    scratch_dir: /home/admin/.cache/euboulia
    python: python3
    startup_timeout_seconds: 600
